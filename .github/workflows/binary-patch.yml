name: Binary Patch Blockman GO (Dylib Inject)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Blockman GO IPA URL'
        required: true
        default: 'https://github.com/exgg199-dotcom/deneme/releases/download/1.21/com.sandboxol.blockmango_v3.31.1_und3fined.ipa'
      mod_zip:
        description: 'Mod ZIP filename in repo root'
        required: false
        default: 'common_1.zip'

jobs:
  patch:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download IPA
        run: |
          echo "Downloading IPA..."
          curl -L -o blockman_go_orig.ipa "${{ github.event.inputs.ipa_url }}"
          ls -lh blockman_go_orig.ipa

      - name: Extract IPA
        run: |
          mkdir -p extracted
          unzip -q blockman_go_orig.ipa -d extracted
          APP=$(ls extracted/Payload/ | head -1)
          echo "APP=$APP" >> $GITHUB_ENV
          BIN_NAME="${APP%.app}"
          echo "BIN_NAME=$BIN_NAME" >> $GITHUB_ENV
          echo "Found: $APP / binary: $BIN_NAME"
          ls -la "extracted/Payload/$APP/"

      - name: Locate binary
        run: |
          APP_PATH="extracted/Payload/${{ env.APP }}"
          BIN="$APP_PATH/${{ env.BIN_NAME }}"
          if [ ! -f "$BIN" ]; then
            BIN=$(find "$APP_PATH" -maxdepth 1 -type f -not -name "*.plist" \
              -not -name "*.png" -not -name "*.strings" -not -name "*.nib" | head -1)
          fi
          echo "BINARY=$BIN" >> $GITHUB_ENV
          echo "Binary: $BIN"
          file "$BIN"
          ls -lh "$BIN"

      - name: Stage NXHook dylib source
        run: |
          cp NXHook/NXHook.c NXHook.c
          echo "Hook source staged from repo:"
          wc -l NXHook.c

      - name: Compile NXHook.dylib for arm64 iOS
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          clang -arch arm64 \
            -isysroot "$SDK" \
            -mios-version-min=15.0 \
            -shared \
            -framework CoreFoundation \
            -o NXHook.dylib NXHook.c
          file NXHook.dylib
          ls -lh NXHook.dylib

      - name: Inject dylib load command into binary
        run: |
          BINARY="${{ env.BINARY }}"
          DYLIB_INSTALL_NAME="@executable_path/Frameworks/NXHook.dylib"

          echo "Before injection:"
          otool -L "$BINARY" | tail -5

          # Remove existing code signature (will be re-signed by KSign/ESign)
          codesign --remove-signature "$BINARY" 2>/dev/null || true

          # Inject LC_LOAD_WEAK_DYLIB via self-contained Mach-O patcher
          python3 NXHook/macho_inject.py "$BINARY" "$DYLIB_INSTALL_NAME"

          echo "After injection:"
          otool -L "$BINARY" | tail -10
          echo "--- verifying load command present ---"
          otool -l "$BINARY" | grep -A3 "NXHook.dylib" || \
            (echo "ERROR: dylib load command not found after inject" && exit 1)

      - name: Place NXHook.dylib in Frameworks
        run: |
          APP_PATH="extracted/Payload/${{ env.APP }}"
          mkdir -p "$APP_PATH/Frameworks"
          cp NXHook.dylib "$APP_PATH/Frameworks/"
          echo "Dylib placed: $APP_PATH/Frameworks/NXHook.dylib"
          ls -la "$APP_PATH/Frameworks/"

      - name: Extract mod zip and place in Engine/Common
        run: |
          MOD_ZIP="${{ github.event.inputs.mod_zip }}"
          APP_PATH="extracted/Payload/${{ env.APP }}"

          if [ ! -f "$MOD_ZIP" ]; then
            echo "ERROR: $MOD_ZIP not found"
            ls *.zip 2>/dev/null || echo "No zip files in repo root"
            exit 1
          fi

          mkdir -p mod_files
          unzip -q "$MOD_ZIP" -d mod_files
          echo "Mod contents:"
          find mod_files -type f

          # Place directly into bundle Engine/Common (hook redirects reads here)
          mkdir -p "$APP_PATH/Engine/Common"
          find mod_files -type f | while read f; do
            BASENAME=$(basename "$f")
            DST="$APP_PATH/Engine/Common/$BASENAME"
            cp "$f" "$DST"
            echo "  WROTE: $DST"
          done

      - name: Strip code signature from dylib
        run: |
          APP_PATH="extracted/Payload/${{ env.APP }}"
          codesign --remove-signature "$APP_PATH/Frameworks/NXHook.dylib" 2>/dev/null || true
          # Ad-hoc sign (KSign/ESign will re-sign the whole IPA)
          codesign -f -s - "$APP_PATH/Frameworks/NXHook.dylib" 2>/dev/null || true

      - name: Repack IPA
        run: |
          cd extracted
          zip -qr ../blockman_go_patched.ipa Payload
          cd ..
          ls -lh blockman_go_patched.ipa

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: BlockmanGO-dylib-patched
          path: blockman_go_patched.ipa
          retention-days: 7

      - name: Upload dylib for reference
        uses: actions/upload-artifact@v4
        with:
          name: NXHook-dylib
          path: NXHook.dylib
          retention-days: 7
